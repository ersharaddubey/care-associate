name: Care Associate mobile-app bundle checks

on:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-app-check.yml'
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-app-check.yml'

jobs:
  expo-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install mobile dependencies
        run: npm install
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir /tmp/care-associate-mobile-export
