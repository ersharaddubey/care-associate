name: Care Associate mobile checks

on:
  push:
    paths:
      - 'care-associate/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'care-associate/**'
      - '.github/workflows/mobile-check.yml'

jobs:
  mobile-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: care-associate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: care-associate/package-lock.json
      - run: npm install
      - run: npx expo install --check
      - run: npx expo prebuild --platform android --no-install
      - run: npx expo export --platform android
      - run: npx expo-doctor
