name: Care Associate server checks

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-check.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-check.yml'

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: npm install
      - name: Check server JavaScript syntax
        run: node --check index.js && node --check emailAuth.js && node --check models.js
      - name: Run backend tests
        run: npm test
